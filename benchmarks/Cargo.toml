[package]
name = "bytesurgeon-benchmarks"
version = "1.0.0"
edition = "2021"
publish = false

[[bench]]
name = "signature_scanning"
harness = false

[[bench]]
name = "file_carving"
harness = false

[[bench]]
name = "filesystem_parsing"
harness = false

[[bench]]
name = "parallel_vs_serial"
harness = false

[[bench]]
name = "memory_usage"
harness = false

[[bench]]
name = "cache_performance"
harness = false

[dependencies]
bytesurgeon-core = { path = "../core" }
bytesurgeon-filesystem = { path = "../filesystem" }
rand = "0.8"
tempfile = "3.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
