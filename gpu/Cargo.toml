[package]
name = "bytesurgeon-gpu"
version = "1.0.0"
edition = "2021"
authors = ["Byte Surgeon Team"]
description = "GPU acceleration for Byte Surgeon using CUDA and OpenCL"

[dependencies]
bytesurgeon-core = { path = "../core" }
bytesurgeon-filesystem = { path = "../filesystem" }
tokio = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true }
parking_lot = { workspace = true }
byteorder = { workspace = true }
cuda-driver-sys = { workspace = true }
ocl = { workspace = true }
bytemuck = { workspace = true }

[features]
default = ["cuda", "opencl"]
cuda = []
opencl = []
