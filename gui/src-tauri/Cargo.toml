[package]
name = "bytesurgeon-gui"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "GUI application for Byte Surgeon"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
bytesurgeon-core = { path = "../../core" }
bytesurgeon-devices = { path = "../../devices" }
bytesurgeon-filesystem = { path = "../../filesystem" }
bytesurgeon-network = { path = "../../network" }
bytesurgeon-mobile = { path = "../../mobile" }
bytesurgeon-security = { path = "../../security" }
bytesurgeon-crypto = { path = "../../crypto" }
bytesurgeon-diskimage = { path = "../../diskimage" }
bytesurgeon-encryption = { path = "../../encryption" }
bytesurgeon-raid = { path = "../../raid" }
bytesurgeon-forensic = { path = "../../forensic" }
bytesurgeon-chat = { path = "../../chat" }
bytesurgeon-enterprise = { path = "../../enterprise" }
tauri = { version = "1.6", features = ["shell-open"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
dirs.workspace = true

[features]
custom-protocol = ["tauri/custom-protocol"]
