[workspace]
members = [
    "core",
    "filesystem",
    "devices",
    "network",
    "mobile",
    "security",
    "crypto",
    "gui/src-tauri",
    "cli",
    "diskimage",
    "encryption",
    "raid",
    "forensic",
    "chat",
    "enterprise",
    "ml",
    "i18n",
    "templates",
    "benchmarks",
    "sdk",
    "gpu",
    "cloud-storage",
    "media-recovery",
]
exclude = ["fuzz"]
resolver = "2"

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Byte Surgeon Team"]
license = "Proprietary"
repository = "https://github.com/yourorg/bytesurgeon"
description = "Advanced cross-platform data recovery software"

[workspace.dependencies]
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
rayon = "1.8"
crossbeam = "0.8"
parking_lot = "0.12"
byteorder = "1.5"
nom = "7.1"
bitflags = "2.4"
tempfile = "3.10"
walkdir = "2.4"
glob = "0.3"
regex = "1.10"
lazy_static = "1.4"
dashmap = "5.5"
num_cpus = "1.16"
memmap2 = "0.9"
crc32fast = "1.3"
flate2 = "1.0"
zip = "0.6"
tar = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"
colored = "2.1"
dirs = "5.0"
cuda-driver-sys = "0.3.0"
ocl = "0.19"
bytemuck = { version = "1.14", features = ["derive"] }
